name: Deploy Firebase

on:
  push:
    branches:
      - main
    paths:
      - "investment-dashboard/**"
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect deploy targets
        id: targets
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git ls-tree -r --name-only "${{ github.sha }}")"
          else
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          deploy_hosting=false
          deploy_functions=false

          if printf '%s\n' "$changed_files" | grep -Eq '^(investment-dashboard/|firebase\.json$|\.firebaserc$)'; then
            deploy_hosting=true
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^(functions/|firebase\.json$|\.firebaserc$)'; then
            deploy_functions=true
          fi

          echo "deploy_hosting=$deploy_hosting" >> "$GITHUB_OUTPUT"
          echo "deploy_functions=$deploy_functions" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.targets.outputs.deploy_hosting == 'true' || steps.targets.outputs.deploy_functions == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        if: steps.targets.outputs.deploy_hosting == 'true' || steps.targets.outputs.deploy_functions == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EASYINVESTTW }}

      - name: Install Firebase CLI
        if: steps.targets.outputs.deploy_hosting == 'true' || steps.targets.outputs.deploy_functions == 'true'
        run: npm install -g firebase-tools@15.17.0

      - name: Install Functions dependencies
        if: steps.targets.outputs.deploy_functions == 'true'
        working-directory: functions
        run: npm ci

      - name: Deploy Hosting
        if: steps.targets.outputs.deploy_hosting == 'true'
        run: firebase deploy --only hosting --project easyinvesttw --non-interactive

      - name: Deploy Functions
        if: steps.targets.outputs.deploy_functions == 'true'
        run: firebase deploy --only functions --project easyinvesttw --non-interactive

      - name: No deployment required
        if: steps.targets.outputs.deploy_hosting != 'true' && steps.targets.outputs.deploy_functions != 'true'
        run: echo "No Firebase deployment needed for this push."
