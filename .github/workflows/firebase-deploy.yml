name: Deploy Firebase

on:
  push:
    branches:
      - main
    paths:
      - "investment-dashboard/**"
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EASYINVESTTW }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.17.0

      - name: Deploy Hosting and Functions
        run: firebase deploy --only hosting,functions --project easyinvesttw --non-interactive
